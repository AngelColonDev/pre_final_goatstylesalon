<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Panel privado del administrador de programacion. No se enlaza desde ninguna pagina. -->
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="referrer" content="no-referrer">
    <title>Acceso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #070707; --panel: #121212; --panel-2: #181818; --line: rgba(255,255,255,.08); --text: #f5f1e8; --muted: #9f9886; --gold: #d4af37; --gold-soft: #f3d68a; --ok: #3fb950; --warn: #f1be5d; --bad: #ff6b6b; --info: #58a6ff; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; font-family: 'Inter', system-ui, sans-serif; color: var(--text); background: radial-gradient(circle at top right, rgba(88,166,255,.10), transparent 30%), linear-gradient(180deg, #0a0a0a, #040404); }
        a { color: var(--gold); }
        button, input, select, textarea { font: inherit; }
        .hidden { display: none !important; }

        /* Login */
        .login { min-height: 100vh; display: grid; place-items: center; padding: 1.25rem; }
        .login-card { width: min(420px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 2rem 1.6rem; display: grid; gap: 1rem; }
        .login-card h1 { font-family: 'Cinzel', serif; font-size: 1.4rem; color: var(--gold); }
        .login-card p { color: var(--muted); font-size: .88rem; line-height: 1.6; }

        /* Layout */
        .shell { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
        .side { background: #0b0b0b; border-right: 1px solid var(--line); padding: 1.4rem 1rem; display: grid; align-content: start; gap: 1.2rem; position: sticky; top: 0; height: 100vh; }
        .side h2 { font-family: 'Cinzel', serif; color: var(--gold); font-size: 1.05rem; }
        .side small { color: var(--muted); display: block; margin-top: .25rem; font-size: .75rem; }
        .tabs { display: grid; gap: .35rem; }
        .tab { display: flex; gap: .7rem; align-items: center; width: 100%; text-align: left; padding: .75rem .85rem; border-radius: 12px; border: 1px solid transparent; background: none; color: var(--text); cursor: pointer; }
        .tab i { width: 18px; color: var(--gold); }
        .tab.active { background: rgba(212,175,55,.12); border-color: rgba(212,175,55,.3); }
        .tab .badge { margin-left: auto; background: var(--bad); color: #fff; border-radius: 999px; font-size: .72rem; font-weight: 800; padding: .1rem .5rem; }
        .main { padding: 1.6rem; display: grid; gap: 1.2rem; align-content: start; min-width: 0; }
        .head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
        .head h1 { font-size: 1.5rem; }
        .head p { color: var(--muted); font-size: .88rem; }

        .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 1.25rem; display: grid; gap: .9rem; min-width: 0; }
        .card h3 { font-size: 1rem; display: flex; gap: .5rem; align-items: center; }
        .card h3 i { color: var(--gold); }
        .muted { color: var(--muted); font-size: .85rem; line-height: 1.6; }
        .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
        .stat strong { display: block; font-size: 1.8rem; color: var(--gold-soft); }
        .stat span { color: var(--muted); font-size: .85rem; }

        .btn { display: inline-flex; align-items: center; gap: .5rem; border: 0; border-radius: 999px; padding: .7rem 1.1rem; font-weight: 700; font-size: .85rem; cursor: pointer; background: linear-gradient(135deg, #f6dfa0 0%, #d4af37 62%, #87640f 100%); color: #111; text-decoration: none; }
        .btn.ghost { background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,.18); }
        .btn.danger { background: #c93636; color: #fff; }
        .btn.ok { background: #238636; color: #fff; }
        .btn:disabled { opacity: .55; cursor: wait; }
        .row { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }

        label.field { display: grid; gap: .4rem; font-size: .85rem; font-weight: 600; }
        .field input, .field textarea, .field select { width: 100%; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); padding: .75rem .9rem; color-scheme: dark; }
        .field textarea { min-height: 90px; resize: vertical; }
        .field input:focus, .field textarea:focus { outline: none; border-color: var(--gold); }

        .switch-row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .8rem 0; border-top: 1px solid var(--line); }
        .switch-row:first-child { border-top: 0; }
        .switch-row strong { display: block; font-size: .92rem; }
        .switch-row small { color: var(--muted); font-size: .8rem; }
        .switch { position: relative; width: 48px; height: 28px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .switch span { position: absolute; inset: 0; border-radius: 999px; background: #444; cursor: pointer; transition: background .2s; }
        .switch span::before { content: ''; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px; border-radius: 50%; background: #fff; transition: transform .2s; }
        .switch input:checked + span { background: var(--bad); }
        .switch input:checked + span::before { transform: translateX(20px); }
        .switch input:focus-visible + span { outline: 2px solid var(--gold); outline-offset: 2px; }

        .status-pill { display: inline-flex; align-items: center; gap: .4rem; padding: .3rem .7rem; border-radius: 999px; font-size: .75rem; font-weight: 800; }
        .status-pill.on { background: rgba(255,107,107,.15); color: var(--bad); }
        .status-pill.off { background: rgba(63,185,80,.15); color: var(--ok); }
        .status-pill.warn { background: rgba(241,190,93,.15); color: var(--warn); }

        .lock { border: 1px solid rgba(255,107,107,.35); background: rgba(255,107,107,.05); border-radius: 16px; padding: 1rem; display: grid; gap: .8rem; }
        .lock.resolved { border-color: var(--line); background: transparent; opacity: .85; }
        .lock-head { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; align-items: center; }
        .lock-head strong { font-size: 1.05rem; }
        .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: .5rem 1rem; }
        .kv div { font-size: .85rem; overflow-wrap: anywhere; }
        .kv small { display: block; color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; }

        .tests { display: grid; gap: .5rem; }
        .test { display: grid; grid-template-columns: auto 1fr auto; gap: .8rem; align-items: center; padding: .75rem .9rem; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); }
        .test .icon { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .8rem; background: #333; }
        .test.ok .icon { background: var(--ok); color: #fff; }
        .test.warn .icon { background: var(--warn); color: #111; }
        .test.fail .icon { background: var(--bad); color: #fff; }
        .test.running .icon { background: var(--info); color: #fff; }
        .test strong { font-size: .9rem; }
        .test small { display: block; color: var(--muted); font-size: .8rem; margin-top: .15rem; overflow-wrap: anywhere; }
        .test .ms { color: var(--muted); font-size: .75rem; white-space: nowrap; }

        table { width: 100%; border-collapse: collapse; font-size: .82rem; }
        th, td { text-align: left; padding: .55rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
        th { color: var(--muted); font-weight: 600; }
        .table-wrap { overflow-x: auto; }

        @media (max-width: 860px) {
            .shell { grid-template-columns: 1fr; }
            .side { position: static; height: auto; }
            .tabs { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
            .main { padding: 1rem; }
        }
    </style>
</head>
<body>
    <section class="login" id="login-view">
        <form class="login-card" id="login-form" novalidate>
            <h1><i class="fas fa-terminal"></i> Acceso restringido</h1>
            <p>Área privada de administración técnica.</p>
            <label class="field hidden" id="dev-email-field">Correo<input id="dev-email" type="email" autocomplete="username"></label>
            <label class="field">Clave de acceso<input id="dev-password" type="password" autocomplete="current-password" required></label>
            <div class="muted" id="login-error" role="alert" style="color: var(--bad);"></div>
            <button class="btn" type="submit"><i class="fas fa-right-to-bracket"></i> Entrar</button>
        </form>
    </section>

    <section class="login hidden" id="setup-view">
        <form class="login-card" id="setup-form" novalidate>
            <h1><i class="fas fa-key"></i> Crea tu clave personal</h1>
            <p>Es tu primer acceso. Por seguridad, reemplaza la clave inicial por una que solo tú conozcas.</p>
            <label class="field">Nueva clave<input id="setup-password" type="password" required></label>
            <label class="field">Confirmar nueva clave<input id="setup-confirm" type="password" required></label>
            <div class="muted" id="setup-error" role="alert" style="color: var(--bad);"></div>
            <button class="btn" type="submit"><i class="fas fa-floppy-disk"></i> Guardar y entrar</button>
        </form>
    </section>

    <div class="shell hidden" id="app-view">
        <aside class="side">
            <div>
                <h2><i class="fas fa-code"></i> Panel técnico</h2>
                <small>Administración de programación · privado</small>
            </div>
            <nav class="tabs" id="tabs">
                <button class="tab active" data-tab="summary"><i class="fas fa-gauge"></i>Resumen</button>
                <button class="tab" data-tab="security"><i class="fas fa-user-lock"></i>Cuentas bloqueadas<span class="badge hidden" id="lock-badge">0</span></button>
                <button class="tab" data-tab="maintenance"><i class="fas fa-screwdriver-wrench"></i>Mantenimiento</button>
                <button class="tab" data-tab="tests"><i class="fas fa-vial"></i>Pruebas</button>
                <button class="tab" data-tab="system"><i class="fas fa-server"></i>Sistema</button>
            </nav>
            <div class="row">
                <a class="btn ghost" href="../index.html" target="_blank" rel="noopener"><i class="fas fa-up-right-from-square"></i> Ver sitio</a>
                <button class="btn ghost" id="logout"><i class="fas fa-right-from-bracket"></i> Salir</button>
            </div>
        </aside>
        <main class="main" id="content"></main>
    </div>

    <script src="../supabase-config.js?v=20261124b"></script>
    <script src="../shared-data.js?v=20261124b"></script>
    <script src="../supabase-sync.js?v=20261124f"></script>
    <script src="../password-policy.js?v=20261124b"></script>
    <script src="../security.js?v=20261124f"></script>
    <script src="ops.js?v=20261124b"></script>
</body>
</html>
