<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil del Barbero | Goat Style Salon</title>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dtw3qx4qq/image/upload/v1783972135/b3a13ac1-cac2-4367-9c0d-5946397d4ff9-removebg-preview_xhkncw.png">
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/dtw3qx4qq/image/upload/v1783972135/b3a13ac1-cac2-4367-9c0d-5946397d4ff9-removebg-preview_xhkncw.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="shared-theme.css">
    <style>
        :root {
            --bg: var(--theme-bg);
            --panel: var(--theme-panel);
            --panel-soft: var(--theme-panel-soft);
            --text: var(--theme-text);
            --muted: var(--theme-muted);
            --gold: var(--theme-gold);
            --gold-soft: var(--theme-gold-soft);
            --line: var(--theme-line);
            --success: var(--theme-success);
            --danger: var(--theme-danger);
            --shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
        }

        body.light-mode { --shadow: 0 18px 45px rgba(16, 24, 40, 0.1); }
        body.light-mode .card,
        body.light-mode .btn-link,
        body.light-mode .icon,
        body.light-mode .stat-card,
        body.light-mode .cert-item,
        body.light-mode .meta-item,
        body.light-mode .social-link,
        body.light-mode .tags span { background: rgba(0, 0, 0, 0.04); color: #7a5c12; }
        body.light-mode .nav { background: rgba(255, 255, 255, .96); border-top-color: rgba(0, 0, 0, .08); }
        body.light-mode .nav a { color: #6b7280; }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(212, 175, 55, 0.16), transparent 28%),
                radial-gradient(circle at top right, rgba(212, 175, 55, 0.10), transparent 24%),
                linear-gradient(180deg, #090909 0%, #040404 100%);
            padding: 0 0 92px;
        }

        a { color: inherit; text-decoration: none; }
        h1, h2, h3 { font-family: 'Cinzel', serif; margin: 0; }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 30;
            backdrop-filter: blur(18px);
            background: rgba(7, 7, 7, 0.82);
            border-bottom: 1px solid rgba(212, 175, 55, 0.12);
        }

        .topbar-inner {
            max-width: 1080px;
            margin: 0 auto;
            padding: 1rem 1.1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .brand { display: flex; flex-direction: column; gap: 0.15rem; }
        .brand strong { font-family: 'Cinzel', serif; letter-spacing: 0.2rem; font-size: 1rem; }
        .brand span { color: var(--muted); font-size: 0.78rem; letter-spacing: 0.18rem; text-transform: uppercase; }

        .top-actions { display: flex; align-items: center; gap: 0.75rem; }

        .btn-link {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            border-radius: 999px;
            padding: 0.9rem 1.1rem;
            border: 1px solid rgba(212, 175, 55, 0.18);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
            font-weight: 600;
            transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
            cursor: pointer;
            font: inherit;
        }

        .btn-link:hover {
            transform: translateY(-1px);
            border-color: rgba(212, 175, 55, 0.45);
            background: rgba(212, 175, 55, 0.08);
        }

        .btn-link:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

        /* Los botones de color mantienen su fondo y texto al pasar el cursor, tocar o enfocar
           (antes el :hover generico les quitaba el fondo y quedaban negros). */
        .btn-primary,
        .btn-primary:hover,
        .btn-primary:active,
        .btn-primary:focus,
        body.light-mode .btn-primary { background: linear-gradient(135deg, #f6dfa0 0%, #d4af37 58%, #8c6916 100%); color: #111; border-color: transparent; }
        .btn-primary:hover { filter: brightness(1.06); box-shadow: 0 10px 24px rgba(212, 175, 55, 0.28); }
        .btn-whatsapp,
        .btn-whatsapp:hover,
        .btn-whatsapp:active,
        .btn-whatsapp:focus,
        body.light-mode .btn-whatsapp { background: linear-gradient(135deg, #3fe089 0%, #1fae63 100%); color: #06210f; border-color: transparent; }
        .btn-whatsapp:hover { filter: brightness(1.05); box-shadow: 0 10px 24px rgba(31, 174, 99, 0.28); }
        .btn-primary:active, .btn-whatsapp:active { transform: scale(0.98); }

        .page { max-width: 1080px; margin: 0 auto; padding: 2rem 1.1rem 4rem; }

        .profile-hero {
            position: relative;
            overflow: hidden;
            border-radius: 34px;
            border: 1px solid rgba(212, 175, 55, 0.14);
            box-shadow: var(--shadow);
            min-height: 420px;
            display: flex;
            align-items: end;
            background-size: cover;
            background-position: center top;
        }

        .profile-hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(4,4,4,0.72) 55%, rgba(4,4,4,0.96) 100%);
        }

        .profile-hero-content { position: relative; z-index: 1; padding: 2.25rem; width: 100%; }

        .profile-avatar {
            width: 108px;
            height: 108px;
            border-radius: 50%;
            background-size: cover;
            background-position: center top;
            border: 3px solid var(--gold);
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
            margin-bottom: 1.1rem;
        }

        .status-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.9rem;
            border-radius: 999px;
            font-size: 0.72rem;
            letter-spacing: 0.1rem;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }
        .status-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
        .status-chip.online { color: var(--success); background: rgba(83, 214, 123, 0.14); border: 1px solid rgba(83, 214, 123, 0.24); }
        .status-chip.offline { color: var(--danger); background: rgba(240, 113, 113, 0.14); border: 1px solid rgba(240, 113, 113, 0.24); }

        .profile-hero h1 { font-size: clamp(2.1rem, 5vw, 3.6rem); line-height: 1.05; margin-bottom: 0.35rem; }
        .profile-alias { display: inline-block; color: var(--gold-soft); letter-spacing: 0.2rem; text-transform: uppercase; font-size: 0.9rem; margin-bottom: 1rem; }

        .tags { display: flex; flex-wrap: wrap; gap: 0.6rem; }
        .tags span {
            padding: 0.55rem 0.85rem;
            border-radius: 999px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f3dfad;
            font-size: 0.8rem;
        }

        .cta-band {
            margin-top: 1.75rem;
            border-radius: 30px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            background: linear-gradient(135deg, rgba(212,175,55,0.12), rgba(255,255,255,0.02));
            box-shadow: var(--shadow);
            padding: 1.75rem;
            display: grid;
            gap: 1.1rem;
        }

        .cta-band h2 { font-size: 1.4rem; }
        .cta-band p { color: var(--muted); margin: 0.35rem 0 0; line-height: 1.7; }
        .cta-actions { display: flex; flex-wrap: wrap; gap: 0.85rem; }
        .cta-actions .btn-link { padding: 1.05rem 1.5rem; font-size: 0.9rem; }

        .grid-2 { display: grid; grid-template-columns: 1.3fr 0.9fr; gap: 1.5rem; margin-top: 1.75rem; }

        .card {
            border-radius: 28px;
            background: linear-gradient(180deg, rgba(18, 18, 18, 0.98), rgba(8, 8, 8, 0.98));
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            padding: 1.75rem;
        }

        .card h3 { font-size: 1.2rem; margin-bottom: 0.9rem; color: var(--gold-soft); }
        .bio-text { color: var(--muted); line-height: 1.85; }

        .stats-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.9rem; margin-top: 1.25rem; }
        .stat-card { padding: 1rem; border-radius: 20px; background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.05); text-align: center; }
        .stat-card strong { display: block; font-family: 'Cinzel', serif; font-size: 1.6rem; color: var(--gold-soft); margin-bottom: 0.2rem; }
        .stat-card span { color: var(--muted); font-size: 0.82rem; }
        .stat-card .stars { color: var(--gold); font-size: 0.85rem; margin-bottom: 0.25rem; }

        .stat-card-wide { grid-column: 1 / -1; }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 1rem; margin-top: 1.25rem; }
        .product-card { border-radius: 20px; overflow: hidden; border: 1px solid var(--line); background: rgba(255,255,255,0.03); }
        .product-card .product-img { aspect-ratio: 4 / 3; background-size: cover; background-position: center; }
        .product-card .product-body { padding: 0.9rem 1rem 1.1rem; }
        .product-card h4 { margin: 0 0 0.3rem; font-size: 0.98rem; }
        .product-card p { margin: 0 0 0.75rem; color: var(--muted); font-size: 0.82rem; line-height: 1.5; }
        .product-card .product-row { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
        .product-card .product-price { color: var(--gold-soft); font-weight: 700; }
        .product-card .product-stock { color: var(--muted); font-size: 0.75rem; }
        body.light-mode .product-card { background: #fff; }

        .meta-list { display: grid; gap: 0.9rem; }
        .meta-item { display: flex; align-items: center; gap: 0.85rem; padding: 0.9rem 1rem; border-radius: 18px; background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.05); }
        .meta-item i { color: var(--gold); width: 20px; text-align: center; }
        .meta-item small { display: block; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06rem; font-size: 0.68rem; margin-bottom: 0.15rem; }
        .meta-item > div { min-width: 0; }
        .meta-item-hours { align-items: flex-start; }
        .meta-item-hours > div { flex: 1; }
        .meta-item-hours i { margin-top: .2rem; }
        .meta-item strong { font-size: 0.95rem; overflow-wrap: anywhere; word-break: break-word; }


        .subhead { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1rem; color: var(--muted); margin: 1.5rem 0 0.9rem; }
        .socials-row { display: grid; gap: 0.6rem; }
        .social-link { display: flex; align-items: center; gap: 0.85rem; padding: 0.8rem 1rem; border-radius: 16px; background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.05); transition: border-color 0.25s ease, background 0.25s ease; }
        .social-link:hover { border-color: rgba(212, 175, 55, 0.4); background: rgba(212, 175, 55, 0.06); }
        .icon { width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; border: 1px solid rgba(212, 175, 55, 0.2); background: rgba(255, 255, 255, 0.03); color: var(--gold); flex-shrink: 0; }
        .social-link strong { display: block; font-size: 0.88rem; }
        .social-link span { color: var(--muted); font-size: 0.76rem; }
        .no-socials { color: var(--muted); font-size: 0.85rem; }


        .not-found { text-align: center; padding: 4rem 1rem; }
        .not-found h1 { margin-bottom: 1rem; }
        .not-found p { color: var(--muted); margin-bottom: 1.5rem; }

        .nav {
            position: fixed; left: 0; right: 0; bottom: 0;
            display: grid; grid-template-columns: repeat(5, 1fr);
            padding: 0.8rem 0.7rem calc(0.8rem + env(safe-area-inset-bottom));
            background: rgba(8, 8, 8, 0.96);
            border-top: 1px solid rgba(212, 175, 55, 0.15);
            backdrop-filter: blur(18px);
        }
        .nav a { text-align: center; font-size: 0.68rem; color: #d8d2c3; }

        @media (max-width: 820px) {
            .topbar-inner, .top-actions { flex-direction: column; align-items: stretch; }
            .top-actions { width: 100%; }
            .btn-link { justify-content: center; }
            .profile-hero { min-height: 340px; }
            .grid-2 { grid-template-columns: 1fr; }
            .stats-row { grid-template-columns: repeat(2, 1fr); }
        }

        @media (min-width: 969px) {
            body { padding-bottom: 0; }
            .nav { display: none; }
        }
    </style>
</head>

    <main class="page" id="profile-page" data-maintenance-section="barberos"></main>

    <script src="supabase-config.js?v=20261124b"></script>
    <script src="shared-data.js?v=20261124b"></script>
    <script src="supabase-sync.js?v=20261124f"></script>
    <script src="site-guard.js?v=20261124b"></script>
    <script src="shared-preferences.js?v=20261124b"></script>
    <script src="legal.js?v=20261201a"></script>
    <script src="site-chrome.js?v=20261201a"></script>
    <script>
        const translations = {
            es: {
                navAllBarbers: 'Todos los barberos', navBook: 'Reservar cita',
                navHome: 'Inicio', navBarbers: 'Barberos', navBooking: 'Cita', navNews: 'Noticias', navSettings: 'Config',
                notFoundTitle: 'Barbero no encontrado',
                notFoundText: 'El perfil que buscas no está disponible o el enlace es incorrecto.',
                notFoundBtn: 'Ver todos los barberos',
                statusActive: 'Activo', statusDeactivated: 'Desactivado',
                whatsappMsg: 'Hola {name}, vi tu perfil en Goat Style Salon y quiero reservar una cita.',
                contactHeading: 'Contacta directamente con {name}',
                contactText: 'Escribe por WhatsApp o llama al {phone} para separar tu cita o resolver cualquier duda antes de reservar.',
                phoneNotAvailable: 'número no disponible',
                writeWhatsapp: 'Escribir por WhatsApp', callLabel: 'Llamar', bookWith: 'Reservar con',
                aboutHeading: 'Sobre {name}',
                bioFallback: 'Perfil profesional en actualización.',
                yearsExperience: 'Años de experiencia', clientsServed: 'Clientes atendidos',
                clientReviews: 'Reseñas de clientes', avgRating: 'Calificación promedio',
                professionalCerts: 'Certificaciones profesionales',
                contactInfo: 'Información de contacto', phone: 'Teléfono', email: 'Correo', schedule: 'Horario',
                notAvailable: 'No disponible',
                socialMedia: 'Redes Sociales', viewPage: 'Ver página', noSocials: 'Redes sociales no disponibles.',
                reviewsHeading: 'Reseñas de clientes',
                reviewsIntro: 'Opiniones de clientes, publicadas después de que la barbería las revisa.',
                noComment: 'Sin comentario.',
                photoOf: 'Foto de', serviceLabel: 'Servicio', barberLabel: 'Barbero', dateLabel: 'Fecha',
                dateNotRecorded: 'Fecha no registrada',
                starsOf: 'de 5 estrellas',
                noReviews: 'Todavía no hay reseñas públicas.',
                productsHeading: 'Productos de {name}',
                productsIntro: 'Productos que {name} vende directamente. Pregunta por ellos en tu próxima cita.',
                availableSuffix: 'disponibles', soldOut: 'Agotado',
                ariaOf: 'de'
            },
            en: {
                navAllBarbers: 'All barbers', navBook: 'Book appointment',
                navHome: 'Home', navBarbers: 'Barbers', navBooking: 'Booking', navNews: 'News', navSettings: 'Settings',
                notFoundTitle: 'Barber not found',
                notFoundText: 'The profile you are looking for is not available or the link is incorrect.',
                notFoundBtn: 'See all barbers',
                statusActive: 'Active', statusDeactivated: 'Deactivated',
                whatsappMsg: 'Hi {name}, I saw your profile at Goat Style Salon and I want to book an appointment.',
                contactHeading: 'Contact {name} directly',
                contactText: 'Message on WhatsApp or call {phone} to book your appointment or ask any question before booking.',
                phoneNotAvailable: 'number not available',
                writeWhatsapp: 'Message on WhatsApp', callLabel: 'Call', bookWith: 'Book with',
                aboutHeading: 'About {name}',
                bioFallback: 'Professional profile being updated.',
                yearsExperience: 'Years of experience', clientsServed: 'Clients served',
                clientReviews: 'Client reviews', avgRating: 'Average rating',
                professionalCerts: 'Professional certifications',
                contactInfo: 'Contact information', phone: 'Phone', email: 'Email', schedule: 'Schedule',
                notAvailable: 'Not available',
                socialMedia: 'Social Media', viewPage: 'View page', noSocials: 'Social media not available.',
                reviewsHeading: 'Client reviews',
                reviewsIntro: 'Client opinions, published after the barbershop reviews them.',
                noComment: 'No comment.',
                photoOf: 'Photo of', serviceLabel: 'Service', barberLabel: 'Barber', dateLabel: 'Date',
                dateNotRecorded: 'Date not recorded',
                starsOf: 'of 5 stars',
                noReviews: 'There are no public reviews yet.',
                productsHeading: 'Products by {name}',
                productsIntro: 'Products that {name} sells directly. Ask about them at your next appointment.',
                availableSuffix: 'available', soldOut: 'Sold out',
                ariaOf: 'of'
            }
        };

        // Textos EN de especialidades y bios sembradas (shared-data.js); respaldo: el texto original.
        const BARBER_EN = {
            gabriel: { bio: 'General manager and founder of the barbershop.', specialty: { 'Fade Premium': 'Premium Fade', 'Diseño': 'Design', 'Celebridades': 'Celebrities' } },
            darialex: { bio: "Barber and cosmetologist specializing in gentlemen's cuts, colorimetry and long beards.", specialty: { 'Corte para caballeros': "Gentlemen's cuts", 'Colorimetría': 'Colorimetry', 'Barbas largas': 'Long beards' } },
            wilo: { bio: '', specialty: {} }
        };

        function currentLang() {
            return (window.GabyPreferences && window.GabyPreferences.getPreferredLanguage()) || 'es';
        }

        function t(key) {
            const lang = currentLang();
            return (translations[lang] && translations[lang][key]) || translations.es[key] || key;
        }

        function locale() {
            return currentLang() === 'en' ? 'en-US' : 'es-PR';
        }

        function barberBio(barber) {
            if (currentLang() === 'en' && BARBER_EN[barber.id]) return BARBER_EN[barber.id].bio || barber.bio || '';
            return barber.bio || '';
        }

        function barberSpecialty(barber, item) {
            if (currentLang() === 'en' && BARBER_EN[barber.id]) return BARBER_EN[barber.id].specialty[item] || item;
            return item;
        }

        function getDb() {
            return window.GabyData.getState();
        }

        const escapeReview = value => String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));

        function normalizePhoneNumber(phone) {
            const digits = String(phone || '').replace(/\D/g, '');
            if (!digits) return '';
            if (digits.length === 10) return `1${digits}`;
            if (digits.length === 11 && digits.startsWith('1')) return digits;
            return digits;
        }

        function getBarberReviewStats(db, barber) {
            const label = barber.alias && barber.alias !== barber.name ? `${barber.name} (${barber.alias})` : barber.name;
            // Aprobadas con permiso del cliente; las anteriores al permiso (sin cita ni permiso guardado) se siguen mostrando.
            const legacy = review => (review.publishConsent === undefined || review.publishConsent === null) && !review.appointmentCode;
            const reviews = (db.reviews || []).filter(review => (review.barberId === barber.id || review.barber === barber.id || review.barber === label) && review.status === 'APROBADA' && (review.publishConsent === true || legacy(review)));
            const total = reviews.length;
            const avg = total ? reviews.reduce((sum, review) => sum + Number(review.rating || 0), 0) / total : 0;
            return { total, avg, reviews };
        }

        function renderNotFound() {
            document.getElementById('profile-page').innerHTML = `
                <div class="not-found">
                    <h1>${t('notFoundTitle')}</h1>
                    <p>${t('notFoundText')}</p>
                    <a class="btn-link btn-primary" href="barbers.html"><i class="fas fa-arrow-left"></i><span>${t('notFoundBtn')}</span></a>
                </div>
            `;
        }

        function renderProfile() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const db = getDb();
            const barber = (db.barbers || []).find(item => item.id === id);

            if (!barber) {
                renderNotFound();
                return;
            }

            document.title = `${barber.name} | Goat Style Salon`;

            const isActive = barber.active !== false;
            const whatsappNumber = normalizePhoneNumber(barber.phone);
            const whatsappMessage = encodeURIComponent(t('whatsappMsg').replace('{name}', barber.alias || barber.name));
            const whatsappHref = whatsappNumber ? `https://wa.me/${whatsappNumber}?text=${whatsappMessage}` : null;
            const callHref = whatsappNumber ? `tel:+${whatsappNumber}` : null;
            const cover = barber.avatar || barber.gallery?.[0] || '';
            const reviewStats = getBarberReviewStats(db, barber);
            const certifications = barber.certifications || [];
            const products = (db.products || []).filter(product => product.active && product.barberId === barber.id);
            const socialEntries = [
                barber.socials?.instagram ? { icon: 'fab fa-instagram', label: 'Instagram', handle: barber.socials.instagram.replace(/^https?:\/\/(www\.)?instagram\.com\//i, '@'), href: barber.socials.instagram } : null,
                barber.socials?.facebook ? { icon: 'fab fa-facebook-f', label: 'Facebook', handle: t('viewPage'), href: barber.socials.facebook } : null
            ].filter(Boolean);

            document.getElementById('profile-page').innerHTML = `
                <section class="profile-hero" style="background-image:url('${cover}')">
                    <div class="profile-hero-content">
                        <div class="profile-avatar" style="background-image:url('${barber.avatar || cover}')"></div>
                        <span class="status-chip ${isActive ? 'online' : 'offline'}"><span class="dot"></span>${isActive ? t('statusActive') : t('statusDeactivated')}</span>
                        <h1>${barber.name}</h1>
                        <span class="profile-alias">${barber.alias || ''}</span>
                        <div class="tags">${(barber.specialty || []).map(item => `<span>${barberSpecialty(barber, item)}</span>`).join('')}</div>
                    </div>
                </section>

                <section class="cta-band">
                    <div>
                        <h2>${t('contactHeading').replace('{name}', barber.alias || barber.name)}</h2>
                        <p>${t('contactText').replace('{phone}', barber.phone || t('phoneNotAvailable'))}</p>
                    </div>
                    <div class="cta-actions">
                        ${whatsappHref ? `<a class="btn-link btn-whatsapp" href="${whatsappHref}" target="_blank" rel="noopener noreferrer"><i class="fab fa-whatsapp"></i><span>${t('writeWhatsapp')}</span></a>` : ''}
                        ${callHref ? `<a class="btn-link" href="${callHref}"><i class="fas fa-phone"></i><span>${t('callLabel')}: ${barber.phone}</span></a>` : ''}
                        <a class="btn-link btn-primary" href="booking.html?barber=${barber.id}"><i class="fas fa-calendar-check"></i><span>${t('bookWith')} ${barber.alias || barber.name}</span></a>
                    </div>
                </section>

                <section class="grid-2">
                    <div class="card">
                        <h3>${t('aboutHeading').replace('{name}', barber.alias || barber.name)}</h3>
                        <p class="bio-text">${barberBio(barber) || t('bioFallback')}</p>
                        <div class="stats-row">
                            <div class="stat-card"><strong>${barber.yearsExperience || 0}+</strong><span>${t('yearsExperience')}</span></div>
                            <div class="stat-card"><strong>${Number(barber.vipClients || 0).toLocaleString(locale())}+</strong><span>${t('clientsServed')}</span></div>
                            <div class="stat-card"><strong>${reviewStats.total}</strong><span>${t('clientReviews')}</span></div>
                            <div class="stat-card">${reviewStats.total ? `<div class="stars">${'★'.repeat(Math.round(reviewStats.avg))}${'☆'.repeat(5 - Math.round(reviewStats.avg))}</div>` : ''}<strong>${reviewStats.total ? reviewStats.avg.toFixed(1) : '-'}</strong><span>${t('avgRating')}</span></div>
                            <div class="stat-card stat-card-wide"><strong>${certifications.length}</strong><span>${t('professionalCerts')}</span></div>
                        </div>
                    </div>
                    <div class="card">
                        <h3>${t('contactInfo')}</h3>
                        <div class="meta-list">
                            <div class="meta-item"><i class="fas fa-phone"></i><div><small>${t('phone')}</small><strong>${barber.phone || t('notAvailable')}</strong></div></div>
                            <div class="meta-item"><i class="fas fa-envelope"></i><div><small>${t('email')}</small><strong>${barber.email || t('notAvailable')}</strong></div></div>
                            <div class="meta-item meta-item-hours"><i class="fas fa-clock"></i><div><small>${t('schedule')}</small>${window.GabySchedule.html()}</div></div>
                        </div>
                        <div class="subhead">${t('socialMedia')}</div>
                        ${socialEntries.length ? `
                            <div class="socials-row">
                                ${socialEntries.map(social => `
                                    <a class="social-link" href="${social.href}" target="_blank" rel="noopener noreferrer" aria-label="${social.label} ${t('ariaOf')} ${barber.name}">
                                        <span class="icon"><i class="${social.icon}"></i></span>
                                        <div><strong>${social.label}</strong><span>${social.handle}</span></div>
                                    </a>
                                `).join('')}
                            </div>
                        ` : `<p class="no-socials">${t('noSocials')}</p>`}
                    </div>
                </section>

                <section class="card" style="margin-top:1.5rem;" aria-label="${t('reviewsHeading')}">
                    <h3>${t('reviewsHeading')}</h3>
                    <p class="bio-text">${t('reviewsIntro')}</p>
                    <div class="grid-2">
                        ${reviewStats.reviews.map(review => {
                            const photo = review.clientPhoto || '';
                            const safePhoto = /^(https?:\/\/|data:image\/(png|jpe?g|webp|gif);base64,)/i.test(photo) ? photo : '';
                            const serviceLabel = String(review.service || '').split(' + ').map(name => name.trim()).filter(name => name && name !== 'No sé cómo se llama el recorte').join(' + ');
                            const sent = review.createdAt ? new Date(review.createdAt) : null;
                            const when = sent && !Number.isNaN(sent.getTime()) ? sent.toLocaleDateString(locale(), { day: 'numeric', month: 'long', year: 'numeric' })
                                : review.serviceDate ? new Date(`${review.serviceDate}T12:00:00`).toLocaleDateString(locale(), { day: 'numeric', month: 'long', year: 'numeric' }) : t('dateNotRecorded');
                            return `
                            <article class="card">
                                <div class="stars" aria-label="${Number(review.rating)} ${t('starsOf')}">${'★'.repeat(Math.max(0, Math.min(5, Number(review.rating) || 0)))}</div>
                                <p class="bio-text">${escapeReview(review.text) || t('noComment')}</p>
                                <div style="display:flex;align-items:center;gap:1rem;">
                                    <div style="position:relative;overflow:hidden;display:grid;place-items:center;width:48px;height:48px;flex-shrink:0;border-radius:50%;background:rgba(212,175,55,.12);color:var(--gold);">
                                        <span aria-hidden="true">${escapeReview(String(review.clientName || 'C').slice(0, 1).toUpperCase())}</span>
                                        ${safePhoto ? `<img src="${escapeReview(safePhoto)}" alt="${t('photoOf')} ${escapeReview(review.clientName)}" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" onerror="this.remove()">` : ''}
                                    </div>
                                    <strong>${escapeReview(review.clientName)}</strong>
                                </div>
                                <p class="bio-text" style="margin-bottom:0;">${serviceLabel ? `${t('serviceLabel')}: ${escapeReview(serviceLabel)}<br>` : ''}${t('barberLabel')}: ${escapeReview(barber.alias || barber.name)}<br>${t('dateLabel')}: ${escapeReview(when)}</p>
                            </article>
                        `; }).join('') || `<p class="bio-text">${t('noReviews')}</p>`}
                    </div>
                </section>

                ${products.length ? `
                    <section class="card" style="margin-top:1.5rem;">
                        <h3>${t('productsHeading').replace('{name}', barber.alias || barber.name)}</h3>
                        <p class="bio-text" style="margin:0;">${t('productsIntro').replace('{name}', barber.alias || barber.name)}</p>
                        <div class="products-grid">
                            ${products.map(product => `
                                <article class="product-card">
                                    <div class="product-img" style="background-image:url('${product.image}')"></div>
                                    <div class="product-body">
                                        <h4>${product.name}</h4>
                                        <p>${product.desc || ''}</p>
                                        <div class="product-row">
                                            <span class="product-price">${product.price}</span>
                                            <span class="product-stock">${Number(product.stock) > 0 ? `${product.stock} ${t('availableSuffix')}` : t('soldOut')}</span>
                                        </div>
                                    </div>
                                </article>
                            `).join('')}
                        </div>
                    </section>
                ` : ''}
            `;
        }

        renderProfile();
        window.addEventListener('gabydatachange', renderProfile);
        window.addEventListener('storage', event => { if (event.key === window.GabyData.STORAGE_KEY) renderProfile(); });
        window.GabyPreferences.initPreferences({ translations });
    </script>
</body>
</html>
